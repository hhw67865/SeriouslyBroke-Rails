# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # THE ONE REFUSAL RAILS WRITES FOR US, SAID IN THIS APP'S VOICE (plan 3, closing review M4).
  #
  # `Pool` declares `dependent: :restrict_with_error` twice — on `#child_pools` and on
  # `#categories` — and both are REACHABLE on an account: `#return_holdings_to_the_account` returns
  # on its first line for an account, so nothing re-points its categories, and an account is the
  # only pool type another pool can sit inside. The refusal itself is right; the sentence was
  # Rails' own, and "Cannot delete record because dependent child pools exist" names a class of
  # thing this app calls an envelope, tells the user nothing about what to do, and sat on a real
  # screen (`spec/system/pools/show/header_actions_spec.rb`).
  #
  # CUSTOMISED HERE RATHER THAN GUARDED AGAIN IN THE MODEL. `Pool::REFUSALS` — the app's two
  # hand-written refusals — is the same MECHANISM (an error on `:base`, a halted callback chain,
  # rendered by `PoolsController#destroy`'s existing alert branch), so all this needed was the
  # message. Adding a second `before_destroy` beside `restrict_with_error` would have bought the
  # same words and a second guard to keep in step with the first.
  #
  # `%{record}` IS THE ASSOCIATION'S HUMAN NAME, downcased by Rails, which is why the two
  # attribute names below are set: `child_pools` humanises to "child pools", which is the schema's
  # word for it and not the product's.
  #
  # "ANOTHER POOL", NOT "ANOTHER ACCOUNT", AND THE SECOND ARM IS WHY. One key serves both
  # associations — the error is on `:base`, so Rails cannot be given a per-association message —
  # and the destination has to be true of both. An envelope or a goal does move to another ACCOUNT;
  # a CATEGORY's home is a POOL, and for an expense category it is usually an envelope rather than
  # an account. "Another account" was right for one arm and wrong for the arm a user is at least as
  # likely to hit, since an account keeps its own categories (`#return_holdings_to_the_account`
  # re-points a non-account's before the refusal is asked, and returns on its first line for an
  # account). "Pool" is the app's noun for the whole family and is true of both.
  activerecord:
    attributes:
      pool:
        categories: "categories"
        child_pools: "envelopes and goals"
    errors:
      models:
        pool:
          attributes:
            base:
              restrict_dependent_destroy:
                # THE TRAILING INSTRUCTION IS DELETED (Task 7, fix round 1). It read "— move them
                # to another pool first", which named a screen that no longer exists: the category
                # form's pool picker went with the pool layer, so the app offered no way to act on
                # its own refusal. The sentence now states the condition and stops, which is what
                # the delete confirm on Home says will happen.
                has_many: "This account can't be deleted while %{record} still belong to it."
